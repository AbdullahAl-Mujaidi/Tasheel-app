name: fkra
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"  # غير هذا السطر

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  sqflite: ^2.3.3
  path: ^1.9.0
  internet_connection_checker: ^1.0.0+1
  cupertino_icons: ^1.0.8
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  awesome_dialog: ^3.2.1  # غير الإصدار إلى 3.2.1
  intl: ^0.19.0
  path_provider: ^2.1.5
  fl_chart: ^1.2.0
  share_plus: ^13.1.0
  provider: ^6.1.5+1

# أضف هذا القسم لحل التعارض
# dependency_overrides:
#   rive: 0.13.1
#   rive_common: 0.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-VariableFont_slnt,wght.ttf
flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/icon-app.png"  